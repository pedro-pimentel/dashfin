<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Financeira - Saipos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .table-container { max-height: 60vh; overflow-y: auto; }
        th { position: sticky; top: 0; background-color: #f9fafb; z-index: 10; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm border-b border-gray-200 py-4 px-6 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2">
            <i data-lucide="shield-check" class="text-indigo-600 w-6 h-6"></i>
            <h1 class="text-xl font-bold text-gray-800">Auditoria para Saipos</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="btnCopyRobot" class="hidden bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-md font-bold text-sm transition-colors flex items-center gap-2 shadow-sm">
                <i data-lucide="bot" class="w-4 h-4"></i>
                Copiar para Robô
            </button>
            <label for="fileUpload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-bold text-sm transition-colors flex items-center gap-2 shadow-sm">
                <i data-lucide="upload" class="w-4 h-4"></i>
                Carregar Base
            </label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" class="hidden">
        </div>
    </header>

    <main class="flex-grow overflow-y-auto p-6 relative">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10">
            <i data-lucide="file-search" class="w-20 h-20 mb-4 text-gray-300"></i>
            <p class="text-xl font-medium text-gray-600">Auditoria Pendente</p>
            <p class="text-sm mt-2 text-gray-500">Suba a planilha para analisar inconsistências antes de lançar na Saipos.</p>
        </div>

        <div id="dashboardContent" class="hidden flex-col gap-6">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-4">
                <div class="flex gap-4 items-center flex-wrap">
                    <div class="flex-grow relative min-w-[250px]">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-sm" placeholder="Buscar lançamento...">
                    </div>
                    
                    <div class="flex gap-2">
                        <button id="btnFilterErrors" class="bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-lg text-sm font-bold hover:bg-red-100 flex items-center gap-2 transition-colors">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i> Ver Inconsistências
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-blue-500">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Total Validado</p>
                    <h2 id="kpiTotal" class="text-3xl font-black text-gray-800">R$ 0,00</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-gray-500">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Analisados</p>
                    <h2 id="kpiCount" class="text-3xl font-black text-gray-800">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-red-200 bg-red-50 border-l-4 border-l-red-500">
                    <p class="text-xs text-red-500 font-bold uppercase tracking-wider mb-1">Dados Faltantes</p>
                    <h2 id="kpiErrors" class="text-3xl font-black text-red-700">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-yellow-200 bg-yellow-50 border-l-4 border-l-yellow-500">
                    <p class="text-xs text-yellow-600 font-bold uppercase tracking-wider mb-1">Divergência de Datas</p>
                    <h2 id="kpiDates" class="text-3xl font-black text-yellow-700">0</h2>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="px-5 py-3 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-gray-700">Lançamentos</h3>
                    <span id="copyFeedback" class="text-xs font-bold text-green-600 hidden">Copiado para o Robô!</span>
                </div>
                <div class="table-container">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Data</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Fornecedor</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Categoria / Conta</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Forma Pagto</th>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500 uppercase">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-100 text-sm">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        let currentData = [];
        let filteredData = [];
        let showingErrorsOnly = false;

        const fileUpload = document.getElementById('fileUpload');
        const emptyState = document.getElementById('emptyState');
        const dashboardContent = document.getElementById('dashboardContent');
        const searchInput = document.getElementById('searchInput');
        const tableBody = document.getElementById('tableBody');
        const btnFilterErrors = document.getElementById('btnFilterErrors');
        const btnCopyRobot = document.getElementById('btnCopyRobot');
        const copyFeedback = document.getElementById('copyFeedback');

        const getVal = (keys, row) => {
            for(let k of keys) {
                const foundKey = Object.keys(row).find(rk => rk.toLowerCase().includes(k.toLowerCase()));
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && row[foundKey] !== '') return String(row[foundKey]).trim();
            }
            return '';
        };

        function parseAmount(rawValue) {
            if (!rawValue) return 0;
            if (typeof rawValue === 'number') return rawValue;
            let strVal = String(rawValue).trim().replace(/[R$\s]/g, '');
            if (strVal.includes(',') && strVal.includes('.')) {
                strVal = strVal.lastIndexOf(',') > strVal.lastIndexOf('.') ? strVal.replace(/\./g, '').replace(',', '.') : strVal.replace(/,/g, '');
            } else if (strVal.includes(',')) {
                strVal = strVal.replace(',', '.');
            }
            return parseFloat(strVal) || 0;
        }

        const formatCurrency = (value) => value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function auditarLinha(row) {
            const dataPagto = getVal(['Pagamento', 'Data'], row);
            const dataVenc = getVal(['Vencimento'], row) || dataPagto;
            const fornecedor = getVal(['Fornecedor', 'Favorecido'], row);
            const categoria = getVal(['Categoria', 'Financeira'], row);
            const conta = getVal(['Conta', 'Origem'], row);
            const formaPagto = getVal(['Forma', 'Método', 'Pagamento'], row);
            const valor = parseAmount(getVal(['Valor', 'Quantia'], row));
            const descricao = getVal(['Descrição', 'Histórico'], row) || 'Diversos';

            const faltaDadoSaipos = !fornecedor || !categoria || !conta || !formaPagto || valor === 0;
            const divergenciaData = dataPagto !== dataVenc;

            return { 
                faltaDadoSaipos, divergenciaData, 
                fornecedor, categoria, conta, formaPagto, valor, dataPagto, dataVenc, descricao 
            };
        }

        function renderDashboard(data) {
            filteredData = data;
            let totalVal = 0, countErrors = 0, countDates = 0;
            tableBody.innerHTML = '';

            data.forEach(row => {
                const audit = auditarLinha(row);
                totalVal += Math.abs(audit.valor);
                
                if (audit.faltaDadoSaipos) countErrors++;
                if (audit.divergenciaData && !audit.faltaDadoSaipos) countDates++;

                const tr = document.createElement('tr');
                
                let statusHtml = `<span class="inline-flex items-center gap-1 bg-green-50 text-green-700 px-2 py-1 rounded text-xs font-bold"><i data-lucide="check-circle" class="w-3 h-3"></i> OK</span>`;
                if (audit.faltaDadoSaipos) {
                    tr.className = "bg-red-50 border-l-4 border-l-red-500";
                    statusHtml = `<span class="inline-flex items-center gap-1 bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Faltam Dados</span>`;
                } else if (audit.divergenciaData) {
                    tr.className = "bg-yellow-50 border-l-4 border-l-yellow-400";
                    statusHtml = `<span class="inline-flex items-center gap-1 bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold"><i data-lucide="calendar-clock" class="w-3 h-3"></i> Data Div.</span>`;
                }

                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap">${statusHtml}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-gray-600 text-xs">
                        <div class="font-bold">${audit.dataPagto || '-'}</div>
                        ${audit.divergenciaData ? `<div class="text-[10px] text-yellow-600">Venc: ${audit.dataVenc}</div>` : ''}
                    </td>
                    <td class="px-4 py-3 font-medium ${!audit.fornecedor ? 'text-red-500' : 'text-gray-900'}">${audit.fornecedor || 'Ausente'}</td>
                    <td class="px-4 py-3 text-xs">
                        <div class="font-bold ${!audit.categoria ? 'text-red-500' : 'text-indigo-700'}">${audit.categoria || 'Ausente'}</div>
                        <div class="text-gray-500 flex items-center gap-1 mt-0.5 ${!audit.conta ? 'text-red-500' : ''}"><i data-lucide="landmark" class="w-3 h-3"></i> ${audit.conta || 'Ausente'}</div>
                    </td>
                    <td class="px-4 py-3 text-xs ${!audit.formaPagto ? 'text-red-500 font-bold' : 'text-gray-500'}">${audit.formaPagto || 'Ausente'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-right font-bold text-gray-800">${formatCurrency(audit.valor)}</td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById('kpiTotal').textContent = formatCurrency(totalVal);
            document.getElementById('kpiCount').textContent = data.length;
            document.getElementById('kpiErrors').textContent = countErrors;
            document.getElementById('kpiDates').textContent = countDates;
            lucide.createIcons();
        }

        function executarFiltros() {
            const generalQuery = searchInput.value.toLowerCase().trim();
            const filtered = currentData.filter(row => {
                const audit = auditarLinha(row);
                const matchPesquisa = !generalQuery || Object.values(row).join(' ').toLowerCase().includes(generalQuery);
                const matchErro = !showingErrorsOnly || audit.faltaDadoSaipos || audit.divergenciaData;
                return matchPesquisa && matchErro;
            });
            renderDashboard(filtered);
        }

        searchInput.addEventListener('input', executarFiltros);
        
        btnFilterErrors.addEventListener('click', () => {
            showingErrorsOnly = !showingErrorsOnly;
            btnFilterErrors.classList.toggle('bg-red-600', showingErrorsOnly);
            btnFilterErrors.classList.toggle('text-white', showingErrorsOnly);
            executarFiltros();
        });

        btnCopyRobot.addEventListener('click', () => {
            if (filteredData.length === 0) return;
            
            let outputTSV = "";
            filteredData.forEach(row => {
                const audit = auditarLinha(row);
                outputTSV += `${audit.dataPagto}\t${audit.fornecedor}\t${audit.conta}\t${audit.descricao}\t${audit.categoria}\t${audit.formaPagto}\t${audit.valor}\n`;
            });

            navigator.clipboard.writeText(outputTSV).then(() => {
                copyFeedback.classList.remove('hidden');
                setTimeout(() => copyFeedback.classList.add('hidden'), 3000);
            });
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false, dateNF: 'dd/mm/yyyy' });
                
                if (rawData && rawData.length > 0) {
                    currentData = rawData;
                    emptyState.style.display = 'none';
                    dashboardContent.classList.remove('hidden');
                    dashboardContent.classList.add('flex');
                    btnCopyRobot.classList.remove('hidden');
                    renderDashboard(currentData);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
